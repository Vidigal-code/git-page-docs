# SonarQube analysis config for the Git Page Docs monorepo.
# Run from the repo root with SONAR_TOKEN set in the environment:
#   pnpm dlx @sonar/scan
sonar.projectKey=git-page-docs
sonar.projectName=Git Page Docs
sonar.projectVersion=0.0.1
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Main code (one entry per workspace package)
sonar.sources=frontend/src,cli,tools/src,mcp/src

# Test code (unit, smoke and e2e suites)
sonar.tests=frontend/tests,cli/tests,tools/tests,mcp/tests,tools/smoke,mcp/smoke,e2e
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/smoke/**

# Keep build output, deps and docs out of the main scope (cli/tests lives inside cli/)
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/dist/**,**/prebuilt/**,**/coverage/**,**/*.md,cli/tests/**

# TypeScript project references and coverage import
sonar.typescript.tsconfigPaths=tsconfig.json,frontend/tsconfig.json,tools/tsconfig.json,mcp/tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# React components (.tsx) are exercised by the Playwright E2E suite, which does not emit lcov;
# keep them out of the coverage denominator so unit-test coverage reflects the logic modules.
sonar.coverage.exclusions=**/*.tsx

# Pure data tables (theme palettes, layout catalog, language menus). The JS copy/paste
# detector ignores literal values, so any table with a repeated shape is reported as
# duplicated code even when every value differs. They carry no logic to deduplicate.
sonar.cpd.exclusions=cli/data/**
